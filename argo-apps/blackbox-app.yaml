apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 9.*
    helm:
      valueFiles:
        - $values/argo-apps/values-blackbox.yaml
  - repoURL: https://github.com/Mekaze99/k3s-home-lab.git
    targetRevision: main
    ref: values

  syncPolicy:
    automated: { prune: true, selfHeal: true }
