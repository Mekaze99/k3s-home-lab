apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn 
    targetRevision: 1.9.0 
    path: apps/longhorn
    sourceRef:
      repoURL: https://github.com/twoj-login/k3s-home-lab.git
      targetRevision: HEAD
    helm:
      valueFiles:
        - apps/longhorn/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system 
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
