apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mekaze99/k3s-home-lab.git
    targetRevision: HEAD
    path: apps/longhorn
    directory:
      recurse: true
      helm:
        chart: longhorn
        repoURL: https://charts.rancher.io
        valueFiles:
          - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true

