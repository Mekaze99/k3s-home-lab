apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkding
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mekaze99/k3s-home-lab.git 
    targetRevision: HEAD
    path: apps/linkding
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: apps 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
