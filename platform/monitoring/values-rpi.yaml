defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false
    kubeApiserver: true
    kubelet: true
    general: true

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    resources:
      requests: { cpu: "150m", memory: "256Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }
  service:
    type: ClusterIP

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: "25m", memory: "64Mi" }
      limits:   { cpu: "150m", memory: "128Mi" }
  config:
    route:
      receiver: default
      group_by: ['alertname','namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
    receivers:
      - name: default

kube-state-metrics:
  resources:
    requests: { cpu: "50m", memory: "80Mi" }
    limits:   { cpu: "200m", memory: "160Mi" }

nodeExporter:
  resources:
    requests: { cpu: "25m", memory: "40Mi" }
    limits:   { cpu: "150m", memory: "96Mi" }

grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  sidecar:
    dashboards:
      enabled: true
  resources:
    requests: { cpu: "75m", memory: "160Mi" }
    limits:   { cpu: "300m", memory: "320Mi" }

prometheusOperator:
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
