apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
      - name: linkding
        image: sissbruecker/linkding:latest
        ports:
        - containerPort: 9090
        env:
        - name: LD_SUPERUSER_NAME
          value: admin
        - name: LD_SUPERUSER_PASSWORD
          value: admin123
        volumeMounts:
        - mountPath: /etc/linkding/data
          name: linkding-storage
      volumes:
        - name: linkding-storage
          persistentVolumeClaim:
            claimName: likding-data
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilageEscalation: false
        privileged: false 
        capabilities:
          drop: ["ALL"]
